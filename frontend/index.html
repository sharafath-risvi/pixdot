<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#000000" />

    <title>Pixdot</title>
    <meta
      name="description"
      content="Pixdot — agency services, client portal, and team workspace"
    />
    <meta name="application-name" content="Pixdot" />
    <meta name="author" content="Pixdot" />

    <!-- Favicon / app icons -->
    <link rel="icon" href="/logo1.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/logo1.png" type="image/png" sizes="192x192" />
    <link rel="shortcut icon" href="/logo1.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo1.png" />
    <link rel="mask-icon" href="/logo1.png" color="#000000" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pixdot" />

    <meta
      property="og:description"
      content="Pixdot — agency services, client portal, and team workspace"
    />

    <meta name="twitter:card" content="summary" />

      name="twitter:description"
      content="Pixdot — agency services, client portal, and team workspace"
    />
    <meta name="twitter:image" content="/logo1.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"

    />
